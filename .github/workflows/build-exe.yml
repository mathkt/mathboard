# exe 만들기
# - Actions 탭에서 'Run workflow' 를 누르면: main.py 의 APP_VERSION 으로 새 버전(v1.7 등)을 만들고 exe 를 붙입니다.
# - Releases 에서 직접 새 버전을 발행해도: exe 를 만들어 그 버전에 붙입니다.
name: exe 만들기

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 부품 설치
        run: python -m pip install PySide6-Essentials pyinstaller numpy

      - name: exe 만들기
        run: python -m PyInstaller --noconfirm --onefile --windowed --add-data "fonts;fonts" --name mdraw main.py

      - name: 버전 읽기
        id: ver
        shell: bash
        run: echo "v=$(python -c "import re;print(re.search(r'APP_VERSION = \"(.+?)\"', open('main.py', encoding='utf-8').read()).group(1))")" >> "$GITHUB_OUTPUT"

      - name: 발행한 버전에 exe 붙이기
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/mdraw.exe

      - name: 새 버전 만들고 exe 붙이기
        if: github.event_name != 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: 도형그리기 ${{ steps.ver.outputs.v }}
          files: dist/mdraw.exe
          make_latest: true
          body: |
            **mdraw.exe** 하나만 받아서 실행하면 됩니다. (설치·파이썬 필요 없음)
            처음 실행할 때 Windows가 'PC 보호' 경고를 띄우면 **추가 정보 → 실행**을 누르세요.
            바뀐 점은 저장소의 사용법.txt 를 보세요.
