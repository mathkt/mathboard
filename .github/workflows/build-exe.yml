# 새 버전 태그(v1.7 등)를 올리면 Windows에서 exe를 만들어 Releases 에 올립니다.
name: exe 만들기

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 부품 설치
        run: python -m pip install PySide6-Essentials pyinstaller numpy

      - name: exe 만들기
        run: python -m PyInstaller --noconfirm --onefile --windowed --add-data "fonts;fonts" --name mdraw main.py

      - name: 확인
        run: dir dist

      - name: Releases 에 올리기 (태그일 때)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/mdraw.exe
          name: 도형그리기 ${{ github.ref_name }}
          body: |
            **mdraw.exe** 하나만 받아서 실행하면 됩니다. (설치·파이썬 필요 없음)
            처음 실행할 때 Windows가 '알 수 없는 앱' 경고를 띄우면 **추가 정보 → 실행**을 누르세요.
            바뀐 점은 저장소의 사용법.txt 를 보세요.

      - name: 만든 exe 보관 (직접 실행했을 때)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: mdraw
          path: dist/mdraw.exe
