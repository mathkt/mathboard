# exe·설치 파일 만들기
# - Actions 탭에서 'Run workflow': main.py 의 APP_VERSION 으로 새 버전(v1.9 등)을 만들고
#   mdraw-setup.exe(설치 파일)와 mdraw.exe(설치 없이 실행)를 붙입니다.
# - Releases 에서 직접 새 버전을 발행해도 같은 파일을 그 버전에 붙입니다.
name: exe 만들기

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 부품 설치
        run: python -m pip install PySide6-Essentials pyinstaller numpy

      - name: 버전 읽기
        id: ver
        shell: bash
        run: echo "v=$(python -c "import re;print(re.search(r'APP_VERSION = \"(.+?)\"', open('main.py', encoding='utf-8').read()).group(1))")" >> "$GITHUB_OUTPUT"

      - name: exe 하나짜리 만들기 (mdraw.exe)
        run: |
          python installer\make_version.py mdraw.exe
          python -m PyInstaller --noconfirm --onefile --windowed --add-data "fonts;fonts" --add-data "icon;icon" --icon "icon\mdraw.ico" --version-file version_info.txt --name mdraw main.py

      - name: 설치용 폴더 만들기 (빨리 켜지는 방식)
        run: |
          python installer\make_version.py 도형그리기.exe
          python -m PyInstaller --noconfirm --onedir --windowed --add-data "fonts;fonts" --add-data "icon;icon" --icon "icon\mdraw.ico" --version-file version_info.txt --name 도형그리기 main.py

      - name: 설치 파일 만들기 (mdraw-setup.exe)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.v }}" installer\mdraw.iss

      - name: 확인
        run: dir dist

      - name: 발행한 버전에 붙이기
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mdraw-setup.exe
            dist/mdraw.exe

      - name: 새 버전 만들고 붙이기
        if: github.event_name != 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: 도형그리기 ${{ steps.ver.outputs.v }}
          files: |
            dist/mdraw-setup.exe
            dist/mdraw.exe
          make_latest: true
          body: |
            **mdraw-setup.exe** (설치 파일): 받아서 실행하면 설치되고, 바탕화면·시작 메뉴에 바로가기가 생깁니다. 관리자 권한 없이 설치됩니다.
            **mdraw.exe**: 설치 없이 바로 실행하는 파일 (USB 등에 넣어 다닐 때).
            처음 실행할 때 Windows가 'PC 보호' 경고를 띄우면 **추가 정보 → 실행**을 누르세요.
            바뀐 점은 저장소의 사용법.txt 를 보세요.
