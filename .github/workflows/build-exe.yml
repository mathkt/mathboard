# Releases 에서 새 버전(v1.7 등)을 발행하면 Windows에서 exe를 만들어 그 버전에 붙입니다.
name: exe 만들기

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 부품 설치
        run: python -m pip install PySide6-Essentials pyinstaller numpy

      - name: exe 만들기
        run: python -m PyInstaller --noconfirm --onefile --windowed --add-data "fonts;fonts" --name mdraw main.py

      - name: 확인
        run: dir dist

      - name: 발행한 버전에 exe 붙이기
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/mdraw.exe

      - name: 만든 exe 보관 (직접 실행했을 때)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: mdraw
          path: dist/mdraw.exe
